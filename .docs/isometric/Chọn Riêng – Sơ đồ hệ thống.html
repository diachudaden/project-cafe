<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chọn Riêng – Sơ đồ hệ thống</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4ebe0; --paper:#fbf6ef; --ink:#2b2622; --muted:#7a6f66; --line:#d9cbb9;
    --accent:#d9643a; --accent-soft:#f6d9c8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
  header h1{font-size:28px;margin:0 0 4px;letter-spacing:-.02em}
  header p{margin:0;color:var(--muted)}
  .tabs{display:flex;gap:8px;margin:22px 0 14px;flex-wrap:wrap}
  .tab{border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:8px 16px;border-radius:999px;font:600 14px/1 inherit;cursor:pointer}
  .tab[aria-selected=true]{background:var(--ink);color:var(--bg)}
  .tab .n{opacity:.55;margin-right:6px}
  .stage{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
  @media (max-width:900px){.stage{grid-template-columns:1fr}}
  .canvas{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:8px;position:relative}
  .canvas svg{display:block;width:100%;height:auto}
  .panel{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:18px 18px 16px;position:sticky;top:12px}
  .stepno{font:500 12px "JetBrains Mono",monospace;color:var(--accent);letter-spacing:.05em}
  .panel h2{font-size:20px;margin:6px 0 10px;letter-spacing:-.01em}
  .panel .body{font-size:14.5px;line-height:1.6}
  .panel .body p{margin:0 0 10px}
  code,.mono{font-family:"JetBrains Mono",monospace;font-size:12.5px;background:#efe4d6;padding:1px 5px;border-radius:5px}
  .say{margin-top:12px;background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.55}
  .say b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#9a3f1c;margin-bottom:3px}
  .file{margin-top:10px;font-size:12.5px;color:var(--muted)}
  .nav{display:flex;align-items:center;gap:8px;margin-top:16px}
  .nav button:not(.dot){white-space:nowrap;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 14px;font:600 14px inherit;cursor:pointer}
  .nav button.ghost:not(.dot){background:transparent;color:var(--ink)}
  .nav button:not(.dot):disabled{opacity:.3;cursor:default}
  .dots{display:flex;gap:5px;margin-left:auto}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--line);cursor:pointer;border:0;padding:0}
  .dot.on{background:var(--accent)}
  .qa{margin-top:26px}
  .qa h3{font-size:18px;margin:0 0 10px}
  details{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
  summary{cursor:pointer;font-weight:600;font-size:15px}
  details p{margin:8px 0 0;font-size:14.5px;line-height:1.6}
  .hint{color:var(--muted);font-size:12.5px;margin-top:8px}
  /* svg */
  .node{transition:opacity .35s}
  .node.dim{opacity:.22}
  .edge{fill:none;stroke:#b9a892;stroke-width:1.6;stroke-dasharray:4 5;transition:opacity .3s}
  .edge.dim{opacity:.25}
  .edge.on{stroke:var(--accent);stroke-width:2.6;stroke-dasharray:none;opacity:1}
  .lbl{font:600 12.5px "Be Vietnam Pro",system-ui,sans-serif;fill:var(--ink)}
  .lbl,.sub{paint-order:stroke;stroke:#fbf6ef;stroke-width:3.5px;stroke-linejoin:round}
  .tl{transition:opacity .35s}.tl.dim{opacity:.22}
  .sub{font:400 10.5px "Be Vietnam Pro",system-ui,sans-serif;fill:var(--muted)}
  .plat-lbl{font:600 11px "JetBrains Mono",monospace;fill:#9b8b78;letter-spacing:.04em}
  .elbl rect{fill:var(--ink)}
  .elbl text{font:500 11px "JetBrains Mono",monospace;fill:#fbf6ef}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Chọn Riêng: hệ thống chạy thế nào</h1>
    <p>Bấm <b>Tiếp</b> (hoặc phím →) để xem từng bước. Mỗi bước có câu "nói với thầy" để ní đọc theo.</p>

  <div class="stage">
    <div class="canvas"><svg id="svg" role="img" aria-label="Sơ đồ isometric"></svg></div>

      <h2 id="stitle"></h2>

      <div class="nav">

        <div class="dots" id="dots"></div>
      </div>
    </aside>

  <section class="qa">
    <h3>Câu thầy hay hỏi</h3>
    <div id="qa"></div>
    <div class="hint">Bấm vào câu hỏi để xem gợi ý trả lời.</div>
  </section>
</div>

/* ---------- iso engine ---------- */
const S = 30, CX = Math.cos(Math.PI/6)*S, CY = 0.5*S;
const P = (x,y,z=0)=>[(x-y)*CX, (x+y)*CY - z*S];
const pt = a=>a.map(v=>v.toFixed(1)).join(',');
const poly = (pts,fill,stroke='#2b2622',sw=1.2)=>`<polygon points="${pts.map(pt).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  const m=v=>Math.max(0,Math.min(255,Math.round(f<0?v*(1+f):v+(255-v)*f)));return `rgb(${m(r)},${m(g)},${m(b)})`;}
function box(x,y,z,w,d,h,c){
  const top=[P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)];
  const xf=[P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x+w,y,z+h)];
  const yf=[P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x,y+d,z+h)];
  return poly(yf,shade(c,-0.12))+poly(xf,shade(c,-0.28))+poly(top,shade(c,0.25));
}
function shape(n){
  const {x,y,w,d,h,c}=n;
  if(n.shape==='stack'){let s='',k=3,g=0.12,hh=(h-g*(k-1))/k;
    for(let i=0;i<k;i++)s+=box(x,y,i*(hh+g),w,d,hh,c);return s;}
  if(n.shape==='gate'){const p=0.32;
    return box(x,y+d/2-p/2,0,p,p,h,c)+box(x+w-p,y+d/2-p/2,0,p,p,h,c)+box(x,y+d/2-p/2,h,w,p,0.3,c);}
  return box(x,y,0,w,d,h,c);
}
function textAt(n){
  const top=n.shape==='gate'?n.h+0.3:n.h;
  const [sx,sy]=P(n.x+n.w/2,n.y+n.d/2,top+0.25);
  return `<text class="lbl" x="${sx}" y="${sy-14}" text-anchor="middle">${n.label}</text>`+
    (n.sub?`<text class="sub" x="${sx}" y="${sy-1}" text-anchor="middle">${n.sub}</text>`:'');
}
const svg=document.getElementById('svg');
let scene, sceneKey, step=0, anim=null;

function render(){
  const sc=scene;
  let pl='',ed='',nd='';
  for(const p of sc.platforms){
    const pts=[P(p.x,p.y,0),P(p.x+p.w,p.y,0),P(p.x+p.w,p.y+p.d,0),P(p.x,p.y+p.d,0)];
    pl+=`<polygon points="${pts.map(pt).join(' ')}" fill="#efe4d6" stroke="#cdbba5" stroke-width="1.2" stroke-dasharray="6 4"/>`;
    const [lx,ly]=P(p.x+0.3,p.y+p.d-0.2,0);
    const ang=Math.atan2(CY,-CX)*180/Math.PI+180; // along -y direction? use x-axis direction
    const [ax,ay]=P(p.x+0.4,p.y+p.d-0.25,0);
    pl+=`<text class="plat-lbl" transform="translate(${ax},${ay}) rotate(${Math.atan2(CY,CX)*180/Math.PI})" dy="-4">${p.label}</text>`;
  }
  for(const e of sc.edges){
    const d='M'+e.pts.map(q=>pt(P(q[0],q[1],0.02))).join(' L');
    ed+=`<path class="edge" id="E-${e.id}" d="${d}"/>`;
  }
  const order=[...sc.nodes].sort((a,b)=>(a.x+a.w+a.y+a.d)-(b.x+b.w+b.y+b.d));
  let tx='';for(const n of order){nd+=`<g class="node" id="N-${n.id}">${shape(n)}</g>`;tx+=`<g class="tl" id="T-${n.id}">${textAt(n)}</g>`;}
  svg.innerHTML=`<g id="root">${pl}${ed}${nd}${tx}<g id="fx"></g></g>`;
  const bb=svg.getElementById('root').getBBox();
  const pad=22;
  svg.setAttribute('viewBox',`${bb.x-pad} ${bb.y-pad-10} ${bb.width+pad*2} ${bb.height+pad*2+10}`);
}

function edgeById(id){return scene.edges.find(e=>e.id===id);}
function showStep(i){
  step=i; const st=scene.steps[i];
  document.getElementById('stepno').textContent=`BƯỚC ${i+1} / ${scene.steps.length}`;
  document.getElementById('stitle').textContent=st.t;
  document.getElementById('sbody').innerHTML=st.b;
  document.querySelector('#ssay span').textContent=st.say;
  document.getElementById('sfile').innerHTML=st.f?`📁 <span class="mono">${st.f}</span>`:'';
  document.getElementById('prev').disabled=i===0;
  document.getElementById('next').textContent=i===scene.steps.length-1?'Từ đầu ↺':'Tiếp →';
  document.querySelectorAll('.dot').forEach((d,k)=>d.classList.toggle('on',k===i));
  const hl=st.hl==='*'?null:new Set(st.hl);
  scene.nodes.forEach(n=>{const dm=!!hl&&!hl.has(n.id);svg.getElementById('N-'+n.id).classList.toggle('dim',dm);svg.getElementById('T-'+n.id).classList.toggle('dim',dm);});
  const flows=st.flow.map(f=>typeof f==='string'?{e:f}:f);
  const on=new Set(flows.map(f=>f.e));
  scene.edges.forEach(e=>{const el=svg.getElementById('E-'+e.id);
    el.classList.toggle('on',on.has(e.id)); el.classList.toggle('dim',!!hl&&!on.has(e.id));});
  runFlow(flows);
}

function runFlow(flows){
  if(anim)cancelAnimationFrame(anim);
  const fx=svg.getElementById('fx'); fx.innerHTML='';
  if(!flows.length)return;
  const segs=flows.map(f=>{const e=edgeById(f.e);let pts=e.pts.map(q=>P(q[0],q[1],0.35));if(f.rev)pts=[...pts].reverse();
    let L=0;const cum=[0];for(let k=1;k<pts.length;k++){L+=Math.hypot(pts[k][0]-pts[k-1][0],pts[k][1]-pts[k-1][1]);cum.push(L);}
    return {pts,cum,L,label:f.label||e.label};});
  fx.innerHTML=`<g id="pk"><polygon points="0,-7 8,-2.5 0,2 -8,-2.5" fill="#f3a27c" stroke="#2b2622" stroke-width="1"/><polygon points="-8,-2.5 0,2 0,8 -8,3.5" fill="#d9643a" stroke="#2b2622" stroke-width="1"/><polygon points="8,-2.5 0,2 0,8 8,3.5" fill="#b44f2a" stroke="#2b2622" stroke-width="1"/></g><g class="elbl" id="el"><rect rx="6" ry="6"/><text text-anchor="middle" dy="4"></text></g>`;
  const pk=svg.getElementById('pk'), el=svg.getElementById('el'), et=el.querySelector('text'), er=el.querySelector('rect');
  const speed=0.16; let si=0, t0=null, hold=0;
  function setLabel(s){et.textContent=s.label;const w=et.getComputedTextLength()+16;er.setAttribute('x',-w/2);er.setAttribute('y',-10);er.setAttribute('width',w);er.setAttribute('height',20);
    const m=at(s,s.L/2);el.setAttribute('transform',`translate(${m[0]},${m[1]-22})`);}
  function at(s,dist){let k=1;while(k<s.cum.length-1&&s.cum[k]<dist)k++;const a=s.pts[k-1],b=s.pts[k],seg=(s.cum[k]-s.cum[k-1])||1,u=Math.min(1,Math.max(0,(dist-s.cum[k-1])/seg));
    return [a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];}
  setLabel(segs[0]);
  function tick(ts){
    if(t0===null)t0=ts; const s=segs[si]; const dist=(ts-t0)*speed*S/30*1.0*6;
    if(dist>=s.L){ if(!hold)hold=ts; const p=at(s,s.L);pk.setAttribute('transform',`translate(${p[0]},${p[1]})`);
      if(ts-hold>450){si=(si+1)%segs.length;t0=null;hold=0;if(si===0){/* loop pause */} setLabel(segs[si]);} }
    else{const p=at(s,dist);pk.setAttribute('transform',`translate(${p[0]},${p[1]})`);}
    anim=requestAnimationFrame(tick);
  }
  anim=requestAnimationFrame(tick);
}

function loadScene(key){
  sceneKey=key; scene=SCENES[key];
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.k===key));
  render();
  const dots=document.getElementById('dots');dots.innerHTML='';
  scene.steps.forEach((_,k)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label','Bước '+(k+1));b.onclick=()=>showStep(k);dots.appendChild(b);});
  document.getElementById('qa').innerHTML=scene.qa.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('');
  showStep(0);
  if(location.hash!=='#'+key)history.replaceState(null,'','#'+key);
}

const tabs=document.getElementById('tabs');
Object.entries(SCENES).forEach(([k,s],i)=>{const b=document.createElement('button');b.className='tab';b.role='tab';b.dataset.k=k;
  b.innerHTML=`<span class="n">${i}</span>${s.name}`;b.onclick=()=>loadScene(k);tabs.appendChild(b);});
document.getElementById('next').onclick=()=>showStep(step===scene.steps.length-1?0:step+1);
document.getElementById('prev').onclick=()=>step>0&&showStep(step-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click();});
window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(SCENES[k]&&k!==sceneKey)loadScene(k);});
const start=location.hash.slice(1);
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>loadScene(SCENES[start]?start:'overview'));
</script>
