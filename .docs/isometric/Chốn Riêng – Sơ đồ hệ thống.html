  .qa h3{font-size:18px;margin:0 0 10px}

  .hint{color:var(--muted);font-size:12.5px;margin-top:8px}

  .node{transition:opacity .35s}
  .node.dim{opacity:.22}
  .edge{fill:none;stroke:#b9a892;stroke-width:1.6;stroke-dasharray:4 5;transition:opacity .3s}

</head>

     f:'ChonRieng.Api/Program.cs · Features/Common/ServiceResult.cs'}
  ],
  qa:[
    ['Sao phải chia 4 project?','Để tách trách nhiệm. Nghiệp vụ (Domain) không dính vào database hay web, nên test được riêng và đổi công nghệ ít ảnh hưởng. Compiler cũng chặn luôn: Domain không tham chiếu Infrastructure nên không thể vô tình gọi DB từ Domain.'],
    ['Sao không có lớp Repository?','DbContext của EF Core bản thân đã là Unit of Work, còn mỗi DbSet đã là một Repository. Bọc thêm một lớp Repository nữa chỉ lặp lại code mà không thêm giá trị. Chỗ nào cần dùng chung thì em có interface riêng như IEntityCrudService.'],
    ['Code First là gì?','Viết class C# trước, EF Core sinh bảng từ class. Mỗi lần sửa class thì tạo một migration ghi lại thay đổi, nhờ vậy cấu trúc DB được quản lý bằng git như code.'],
    ['Dependency Injection dùng ở đâu?','Trong Program.cs và FeatureRegistration.cs: các service đăng ký Scoped (mỗi request một bản), riêng những thứ dùng chung như PaymentLogService thì Singleton. Endpoint chỉ cần khai báo tham số là được framework truyền vào.']
  ]
},

  steps:[
    {t:'Đăng nhập',hl:['app','rl','svc','idn','t_u'],flow:['a1','a2','a3','a4'],
     b:'<p>App gọi <code>POST /api/auth/login</code>. Trước tiên request phải qua <b>rate limit</b>: tối đa 30 lần / 5 phút / IP.</p><p><code>AuthService</code> nhờ <b>ASP.NET Identity</b> kiểm mật khẩu. DB chỉ lưu <b>hash</b>, không lưu mật khẩu gốc.</p><p>Sai <b>5 lần</b> thì tài khoản bị khoá <b>15 phút</b>.</p>',
     say:'Em dùng ASP.NET Identity để quản lý tài khoản: mật khẩu được băm, có khoá tài khoản khi sai nhiều lần và có giới hạn tần suất theo IP để chống dò mật khẩu.',
     f:'Endpoints/AuthEndpoints.cs · Services/AuthService.cs · Program.cs (Lockout)'},
    {t:'Cấp 2 loại token',hl:['svc','tok','t_s'],flow:['a5','a6',{e:'a1',rev:1,label:'access + refresh token'}],
     b:'<p><b>Access token (JWT)</b> sống <b>15 phút</b>, bên trong có id người dùng, vai trò và <code>branch_id</code> (chi nhánh được làm).</p><p><b>Refresh token</b> sống <b>7 ngày</b>, dùng để xin access token mới. DB chỉ lưu <b>hash</b> của nó trong <code>UserSessions</code>.</p>',
     say:'Access token ngắn hạn để lỡ bị lộ thì cũng nhanh hết hạn. Refresh token dài hạn nhưng chỉ lưu dạng băm, nên lộ DB cũng không dùng được.',
     f:'Services/TokenService.cs · JwtOptions.cs'},
    {t:'Gọi API có token',hl:['app','jwt','feat','t_b'],flow:['a7','a8','a9'],
     b:'<p>Mỗi request gửi kèm header <code>Authorization: Bearer &lt;JWT&gt;</code>. JwtBearer kiểm chữ ký và hạn của token, <b>không cần đọc DB</b>.</p><p>Sau đó endpoint áp <b>Policy</b>:</p><p>• <code>Workforce</code>: Admin, BranchManager, Staff<br>• <code>Management</code>: Admin, BranchManager<br>• <code>CustomerOnly</code>, <code>AdminOnly</code></p><p>Trong service còn kiểm <code>CanAccessBranch</code>: quản lý chi nhánh A không xem được dữ liệu chi nhánh B.</p>',
     say:'Phân quyền 2 lớp: lớp vai trò ở endpoint và lớp chi nhánh trong service, nên nhân viên chỉ thấy dữ liệu chi nhánh mình.',
     f:'Features/Common/Policies.cs · CurrentUser.cs'},
    {t:'Hết 15 phút thì sao?',hl:['app','rl','svc','tok','t_s'],flow:[{e:'a1',label:'POST /api/auth/refresh'},'a2','a5','a6'],
     b:'<p>App gửi refresh token lên <code>/api/auth/refresh</code>. Server tìm theo hash, còn hạn thì cấp <b>cặp token mới</b> và <b>thay luôn refresh token</b> (rotation). Token cũ không dùng lại được.</p><p>Đăng xuất thì đánh dấu phiên là đã thu hồi.</p>',
     say:'Em xoay vòng refresh token: mỗi lần dùng là đổi token mới, nên token cũ bị đánh cắp cũng không dùng lại được.',
     f:'AuthService.cs → RefreshAsync / RevokeAsync'},
    {t:'Quên mật khẩu',hl:['app','rl','svc','q','ew','smtp'],flow:[{e:'a1',label:'POST /api/auth/forgot-password'},'a2','a10','a11','a12'],
     b:'<p>Luôn trả <b>202</b> dù email có tồn tại hay không, để người ngoài <b>không dò được</b> email nào đã đăng ký.</p><p>Nếu có tài khoản: Identity tạo token reset (hạn 15 phút), đưa mail vào <code>EmailQueue</code>. Worker nền gửi qua SMTP, nên API trả lời ngay mà không phải chờ.</p><p>Giới hạn 5 lần / 15 phút theo IP và theo email.</p>',
     say:'Chức năng quên mật khẩu không tiết lộ email nào có trong hệ thống, link reset chỉ sống 15 phút, và mail được gửi bất đồng bộ qua hàng đợi.',
     f:'AuthService.cs → RequestPasswordResetAsync · Services/Email/'},
    {t:'Đặt lại / đổi mật khẩu',hl:['svc','idn','t_s','q','ew','smtp'],flow:['a3','a6','a10','a11','a12'],
     b:'<p><b>Đặt lại</b> bằng link: Identity kiểm token rồi đổi mật khẩu, <b>thu hồi tất cả phiên</b> đang đăng nhập và mở khoá tài khoản.</p><p><b>Đổi mật khẩu</b> khi đang đăng nhập: thu hồi các phiên <b>khác</b>, giữ phiên hiện tại, và gửi mail báo "mật khẩu vừa được đổi".</p>',
     say:'Đổi mật khẩu xong thì các thiết bị khác bị đăng xuất, và chủ tài khoản nhận được mail báo để phát hiện nếu không phải mình đổi.',
     f:'AuthService.cs → ResetPasswordAsync / ChangePasswordAsync'}
  ],
  qa:[
    ['Sao dùng JWT mà không dùng session cookie?','Có 3 app khác nhau gọi chung một API. JWT tự chứa thông tin người dùng và vai trò nên API không phải tra DB ở mỗi request, và app nào gửi kèm header cũng dùng được như nhau.'],
    ['JWT bị lộ thì sao?','Access token chỉ sống 15 phút. Refresh token được xoay vòng và lưu dạng hash, đổi mật khẩu thì thu hồi toàn bộ phiên.'],
    ['Phân quyền theo chi nhánh làm thế nào?','Token có claim branch_id. CurrentUser đọc claim đó ra phạm vi chi nhánh, và service gọi CanAccessBranch trước khi trả dữ liệu. Admin thì xem được tất cả.'],
    ['Sao quên mật khẩu lại luôn trả 202?','Nếu trả "email không tồn tại" thì kẻ xấu dò được ai đã đăng ký. Trả cùng một kết quả cho mọi trường hợp thì không lộ gì.'],
    ['Sao gửi mail phải qua hàng đợi?','Gửi SMTP mất vài giây và có thể lỗi mạng. Đưa vào Channel rồi để worker gửi thì API trả lời ngay, người dùng không phải chờ.']
  ]
},

  steps:[
    {t:'Nhân viên cho khách vào chỗ',hl:['pos','ss','t_seat'],flow:['s1','s2'],
     b:'<p>Trên POS, nhân viên chọn <b>ghế</b>, <b>gói giờ</b> (PricePlan) và cách trả (<b>tiền mặt</b> hoặc <b>VietQR</b>), rồi gọi <code>POST /api/sessions</code>.</p><p><code>SessionService</code> kiểm tra trước:</p><p>• Ghế có đang bảo trì không<br>• Ghế đã có lượt ngồi <b>Active</b> chưa<br>• Ghế có đang được giữ bởi một mã QR <b>Pending</b> còn hạn không<br>• Gói giờ có áp dụng cho chi nhánh này và còn hiệu lực không</p>',
     say:'Trước khi bán chỗ, hệ thống kiểm tra ghế không bảo trì, không có người ngồi và không bị giữ bởi một giao dịch QR đang chờ, để tránh bán trùng một ghế cho hai người.',
     f:'Features/Sales/SessionService.cs → CheckInAsync'},
    {t:'Tạo Bill + lượt ngồi',hl:['ss','t_bill','t_cus'],flow:['s3','s11'],
     b:'<p>Trả <b>tiền mặt</b>: tạo ngay <b>Bill</b> (mã 8 ký tự ngẫu nhiên) và <b>Session</b> trạng thái <b>Active</b> với giờ kết thúc <code>EndAt</code> theo gói.</p><p>Trả <b>VietQR</b>: chưa tạo bill mà tạo yêu cầu thanh toán, khi tiền về mới tạo (xem tab <b>Thanh toán VietQR</b>).</p><p>Nếu nhân viên đã chọn khách quen thì cộng điểm luôn.</p>',
     say:'Bill chỉ được tạo khi đã chắc chắn nhận được tiền: tiền mặt thì tạo ngay, chuyển khoản thì đợi webhook xác nhận.',
     f:'SessionService.cs → CheckInAsync / SettlePaymentRequestAsync'},
    {t:'Gọi thêm đồ, gia hạn',hl:['pos','ao','ss','t_bill'],flow:['s4','s5'],
     b:'<p>Khách gọi thêm đồ: <code>POST /sessions/{id}/items</code>. Khách muốn ngồi thêm: <code>POST /sessions/{id}/extend</code>, lùi <code>EndAt</code> theo gói gia hạn.</p><p>Cả hai đều cộng tiền vào <b>cùng bill</b>. Trả bằng QR thì đi qua endpoint <code>…/payment-request</code>.</p>',
     say:'Một lượt ngồi chỉ có một bill, mọi khoản phát sinh như đồ uống hay gia hạn đều cộng vào bill đó.',
     f:'AddOnService.cs · SessionService.cs → ExtendAsync'},
    {t:'Kết thúc lượt ngồi',hl:['pos','ss','t_bill'],flow:[{e:'s1',label:'POST /sessions/{id}/close'},'s3'],
     b:'<p>Khách về, nhân viên bấm kết thúc. Session chuyển sang:</p><p>• <b>Closed</b> nếu về trước <code>EndAt</code><br>• <b>Expired</b> nếu đã ngồi quá giờ</p><p>Ghế tự thành trống, vì "ghế đang có người" được suy ra từ việc có session Active hay không, không lưu cờ riêng.</p>',
     say:'Trạng thái ghế được tính từ lượt ngồi đang hoạt động chứ không lưu riêng, nên không bao giờ lệch giữa ghế và lượt ngồi.',
     f:'SessionService.cs → CloseAsync'},
    {t:'Quên bấm kết thúc?',hl:['wk','t_bill'],flow:['s7'],
     b:'<p><code>SessionAutoReleaseWorker</code> cứ <b>60 giây</b> quét một lần. Session nào vẫn Active mà đã quá <code>EndAt</code> <b>10 phút</b> thì chuyển thành <b>Expired</b> và báo cho nhân viên.</p><p>Câu UPDATE có điều kiện <code>Status = Active</code>. Ngoài ra <code>Status</code> và <code>EndAt</code> là <b>concurrency token</b>, nên nếu nhân viên vừa đóng tay hoặc gia hạn cùng lúc thì không ai ghi đè ai.</p>',
     say:'Ghế không bị kẹt khi nhân viên quên thao tác: hệ thống tự trả chỗ sau 10 phút quá giờ và gửi thông báo.',
     f:'SessionAutoReleaseService.cs · SessionAutoReleaseWorker.cs'},
    {t:'Hoá đơn & tích điểm',hl:['pos','rc','kh','ly','t_cus'],flow:['s8','s9','s10'],
     b:'<p>POS in hoá đơn <b>PDF</b> (thư viện QuestPDF), có <b>mã QR</b> dẫn tới trang tích điểm.</p><p>Khách mở app, nhập hoặc quét mã bill trong vòng <b>7 ngày</b>. Mỗi bill chỉ tích <b>1 lần</b>, tối đa 10 lần thử / phút để không đoán mã được.</p><p><b>1.000đ = 1 điểm</b>. Hạng theo tổng chi: Bronze, Silver từ 500k, Gold từ 2 triệu.</p>',
     say:'Khách vãng lai vẫn tích điểm được: quét QR trên hoá đơn để nhận điểm về tài khoản, có giới hạn thời gian và số lần thử để chống gian lận.',
     f:'ReceiptPdf.cs · LoyaltyService.cs → ClaimAsync · Loyalty.cs'}
  ],
  qa:[
    ['Hai máy POS bán cùng 1 ghế cùng lúc thì sao?','Service kiểm tra trước, nhưng 2 request có thể cùng qua bước kiểm tra. Lớp chặn cuối nằm ở DB: unique index có filter IX_Sessions_SeatId_Active (SeatId duy nhất khi Status = Active). Bản ghi thứ hai vi phạm index nên SQL Server từ chối, code bắt DbUpdateException và trả lỗi "chỗ đã có người".'],
    ['Sao không lưu trạng thái "đang có người" vào bảng Seat?','Lưu 2 nơi thì dễ lệch nhau. Ghế có người khi và chỉ khi có session Active, nên tính ra từ đó là luôn đúng. Seat chỉ lưu trạng thái bảo trì.'],
    ['Closed khác Expired thế nào?','Closed là khách về đúng hoặc trước giờ đã trả. Expired là khách ngồi quá giờ, do nhân viên đóng muộn hoặc worker tự trả chỗ. Báo cáo dùng phân biệt này để biết ghế hay bị ngồi lố.'],
    ['Gia hạn đúng lúc worker đang tự trả chỗ thì sao?','Status và EndAt là concurrency token (optimistic locking). EF chỉ lưu được khi dòng đó vẫn đúng như lúc đọc, nên bên nào ghi sau sẽ nhận DbUpdateConcurrencyException thay vì âm thầm ghi đè.'],
    ['Mã bill có bị đoán được không?','Mã 8 ký tự lấy ngẫu nhiên bằng RandomNumberGenerator từ bảng 32 ký tự (bỏ các ký tự dễ nhầm như 0/O, 1/I), tức khoảng 1 nghìn tỷ tổ hợp. Thêm giới hạn 10 lần / phút nên đoán gần như không thể.']
  ]
},

  steps:[
    {t:'Nhân viên tạo yêu cầu thanh toán',hl:['pos','prs','t_req'],flow:['pos-prs','prs-req'],
     b:'<p>Nhân viên chọn ghế trên POS, POS gọi <code>POST /api/payments/requests</code>.</p><p><code>PaymentRequestService</code> tạo 1 dòng <b>PaymentRequest</b> với:</p><p>• Mã ngẫu nhiên, ví dụ <code>TT</code> + 8 ký tự<br>• Trạng thái <b>Pending</b><br>• Hạn = bây giờ + <b>10 phút</b> (cấu hình <code>HoldMinutes</code>)</p><p>Trước khi tạo, các yêu cầu cũ đã quá hạn của cùng ghế sẽ được huỷ.</p>',
     say:'Mỗi lần thu tiền, hệ thống tạo một yêu cầu thanh toán có mã duy nhất và chỉ có hiệu lực 10 phút.',
     f:'Features/Sales/PaymentRequestService.cs'},
    {t:'Hiện mã QR cho khách',hl:['pos','prs','kh'],flow:[{e:'pos-prs',rev:1,label:'mã + link ảnh QR'},'pos-kh'],
     b:'<p>API trả về mã và link ảnh QR (<code>qr.sepay.vn/img</code>), trong đó đã có sẵn số tiền và nội dung chuyển khoản là mã thanh toán.</p><p>POS hiển thị QR kèm đồng hồ đếm ngược.</p>',
     say:'Mã QR theo chuẩn VietQR nên khách quét bằng app ngân hàng nào cũng được, số tiền và nội dung điền sẵn nên khách không phải gõ.',
     f:'frontend/apps/pos/src/features/counter/PaymentRequestModal.tsx'},
    {t:'Khách chuyển khoản',hl:['kh','bank','sepay'],flow:['kh-bank','bank-sepay'],
     b:'<p>Khách quét QR và chuyển tiền. Ngân hàng báo biến động số dư cho <b>SePay</b>, dịch vụ theo dõi tài khoản ngân hàng của quán.</p>',
     say:'Hệ thống không kết nối trực tiếp với ngân hàng mà thông qua SePay, SePay báo cho mình khi có tiền vào.',
     f:''},
    {t:'SePay gọi webhook',hl:['sepay','gate'],flow:['sepay-gate'],
     b:'<p>SePay gọi <code>POST /api/hooks/sepay-payment</code>, kèm 2 header:</p><p>• <code>X-SePay-Timestamp</code>: thời điểm gửi<br>• <code>X-SePay-Signature</code>: <code>sha256=…</code></p><p>Địa chỉ này công khai, ai cũng gọi được, nên bước tiếp theo là kiểm tra.</p>',
     say:'Webhook là SePay chủ động gọi vào API của em, nên em phải xác minh đúng là SePay gửi chứ không phải ai đó giả mạo.',
     f:'Features/Sales/PaymentEndpoints.cs'},
    {t:'Cổng kiểm tra 3 lớp',hl:['gate','wh'],flow:['gate-wh'],
     b:'<p>1. Body lớn hơn 256 KB thì trả <b>413</b>.</p><p>2. Timestamp lệch quá <b>±300 giây</b> so với giờ máy chủ thì từ chối, chống việc lấy request cũ gửi lại (replay).</p><p>3. Tự tính <b>HMAC-SHA256</b>(<code>timestamp + "." + body</code>, <code>WebhookSecret</code>) rồi so với chữ ký bằng <code>FixedTimeEquals</code>. Sai thì trả <b>401</b>.</p>',
     say:'Chỉ SePay và hệ thống em biết khoá bí mật, nên chỉ SePay tạo được chữ ký đúng. Timestamp nằm trong phần được ký, nên kẻ gian không sửa được thời gian để gửi lại request cũ.',
     f:'SePayWebhookService.cs → CheckSignature / IsValidSignature'},
    {t:'Chống nhận tiền 2 lần',hl:['wh','t_tx'],flow:['wh-tx'],
     b:'<p>SePay có thể gửi lại cùng 1 giao dịch. Hệ thống làm 2 lớp:</p><p>• Kiểm tra <code>ProviderTxId</code> đã có chưa<br>• Nếu 2 request đến cùng lúc thì <b>khoá unique</b> trong DB chặn bản thứ hai</p><p>Bị trùng thì ghi log <code>WebhookDuplicate</code> và vẫn trả <b>200</b>, để SePay biết là đã nhận và không gửi nữa.</p>',
     say:'Em xử lý idempotent: cùng một giao dịch gửi bao nhiêu lần thì cũng chỉ được ghi nhận một lần.',
     f:'SePayWebhookService.cs → ProcessAsync'},
    {t:'Khớp tiền với yêu cầu',hl:['wh','t_req','t_bill'],flow:['wh-req','wh-bill'],
     b:'<p>Dùng regex tìm mã <code>TT…</code> trong nội dung chuyển khoản, rồi tìm PaymentRequest tương ứng. Sau đó xét các trường hợp:</p><p>• Đã <b>Paid</b> rồi thì đánh dấu <i>Duplicate</i><br>• Hết hạn / đã huỷ thì <b>NeedsAttention</b><br>• Thiếu / thừa tiền thì <i>Underpaid</i> / <i>Overpaid</i> + NeedsAttention<br>• Đúng hết thì <b>Paid</b>, tạo <b>Bill + Session</b> và giữ ghế</p><p>Tất cả chạy trong <b>1 transaction DB</b>, lỗi giữa chừng thì rollback.</p>',
     say:'Chỉ khi đúng mã, đúng số tiền, còn hạn thì hệ thống mới tự tạo bill. Trường hợp lệch thì không tự xử lý mà đưa vào danh sách cần xử lý cho quản lý.',
     f:'SePayWebhookService.cs → MatchPaymentAsync'},
    {t:'POS tự biết đã trả',hl:['pos','prs','t_req'],flow:[{e:'pos-prs',label:'GET /api/payments/{code}'},{e:'pos-prs',rev:1,label:'Paid + mã bill'}],
     b:'<p>Trong lúc chờ, POS cứ <b>2,5 giây</b> gọi <code>GET /api/payments/{code}</code> một lần (polling). Khi thấy <b>Paid</b> thì dừng và hiện bill.</p><p>Mỗi bước đều ghi vào <code>PaymentLogs</code> để admin xem lại khi có tranh cãi.</p>',
     say:'Em chọn polling vì đơn giản, ổn định, không cần duy trì kết nối realtime. 2,5 giây là đủ nhanh cho quầy thu ngân.',
     f:'PaymentRequestModal.tsx (refetchInterval) · PaymentLogService.cs'},
    {t:'Khách không trả thì sao?',hl:['exp','t_req'],flow:['exp-req'],
     b:'<p><code>PaymentRequestExpiryWorker</code> cứ <b>30 giây</b> quét một lần. Yêu cầu nào còn <b>Pending</b> mà quá hạn thì chuyển thành <b>Expired</b>, ghế được giải phóng.</p><p>Nếu sau đó tiền mới về thì webhook vẫn lưu giao dịch nhưng đánh dấu <b>NeedsAttention</b> để quản lý xử lý.</p>',
     say:'Ghế không bị giữ mãi: quá 10 phút không trả thì tự huỷ. Tiền về trễ cũng không mất mà được lưu lại để đối soát.',
     f:'Features/Sales/PaymentRequestExpiryWorker.cs'}
  ],
  qa:[
    ['Sao phải kiểm tra chữ ký webhook?','Địa chỉ webhook là công khai. Không kiểm tra thì ai cũng gửi được request kiểu "đã nhận 1 triệu" và lấy ghế miễn phí. HMAC-SHA256 dùng khoá bí mật chỉ SePay và hệ thống biết, nên chỉ SePay tạo được chữ ký đúng.'],
    ['Timestamp để làm gì?','Chống replay. Kẻ gian bắt được một request thật rồi gửi lại sau đó thì timestamp đã lệch quá 300 giây nên bị từ chối. Timestamp cũng nằm trong phần được ký nên không sửa được.'],
    ['Sao dùng FixedTimeEquals mà không dùng ==?','So sánh bằng == dừng ngay ở byte sai đầu tiên, kẻ gian có thể đo thời gian phản hồi để đoán dần chữ ký (timing attack). FixedTimeEquals luôn so hết nên thời gian như nhau.'],
    ['SePay gửi 2 lần một giao dịch thì sao?','Kiểm tra ProviderTxId trước. Nếu 2 request đến cùng lúc thì khoá unique trong DB chặn bản thứ hai, code bắt lỗi trùng khoá đó. Cả hai trường hợp đều trả 200 để SePay ngừng gửi lại.'],
    ['Khách chuyển thiếu, thừa hoặc trễ?','Không tự tạo bill. Giao dịch được lưu với trạng thái Underpaid/Overpaid, yêu cầu chuyển sang NeedsAttention, và quản lý xử lý trong mục giao dịch lệch.'],
    ['Sao không dùng WebSocket để báo POS?','Polling 2,5 giây là đủ nhanh cho quầy, code đơn giản và không phải lo mất kết nối. Nếu một lần gọi lỗi thì POS thử lại sau 5 giây, không bị kẹt màn hình QR.']
  ]
},

/* ---------- iso engine ---------- */
const S = 30, CX = Math.cos(Math.PI/6)*S, CY = 0.5*S;
const P = (x,y,z=0)=>[(x-y)*CX, (x+y)*CY - z*S];
const pt = a=>a.map(v=>v.toFixed(1)).join(',');
const poly = (pts,fill,stroke='#2b2622',sw=1.2)=>`<polygon points="${pts.map(pt).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  const m=v=>Math.max(0,Math.min(255,Math.round(f<0?v*(1+f):v+(255-v)*f)));return `rgb(${m(r)},${m(g)},${m(b)})`;}
function box(x,y,z,w,d,h,c){
  const top=[P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)];
  const xf=[P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x+w,y,z+h)];
  const yf=[P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x,y+d,z+h)];
  return poly(yf,shade(c,-0.12))+poly(xf,shade(c,-0.28))+poly(top,shade(c,0.25));
}
function shape(n){
  const {x,y,w,d,h,c}=n;
  if(n.shape==='stack'){let s='',k=3,g=0.12,hh=(h-g*(k-1))/k;
    for(let i=0;i<k;i++)s+=box(x,y,i*(hh+g),w,d,hh,c);return s;}
  if(n.shape==='gate'){const p=0.32;
    return box(x,y+d/2-p/2,0,p,p,h,c)+box(x+w-p,y+d/2-p/2,0,p,p,h,c)+box(x,y+d/2-p/2,h,w,p,0.3,c);}
  return box(x,y,n.z||0,w,d,h,c);
}
function textAt(n){
  if(n.side){const [sx,sy]=P(n.x+n.w,n.y,(n.z||0)+n.h*0.5);return `<text class="lbl" x="${sx+16}" y="${sy-2}" style="font-size:15px">${n.label}</text><text class="sub" x="${sx+16}" y="${sy+14}">${n.sub}</text>`;}
  const top=n.shape==='gate'?n.h+0.3:n.h;
  const [sx,sy]=P(n.x+n.w/2,n.y+n.d/2,top+0.25);
  return `<text class="lbl" x="${sx}" y="${sy-14}" text-anchor="middle">${n.label}</text>`+
    (n.sub?`<text class="sub" x="${sx}" y="${sy-1}" text-anchor="middle">${n.sub}</text>`:'');
}
const svg=document.getElementById('svg');
let scene, sceneKey, step=0, anim=null;

function render(){
  const sc=scene;
  let pl='',ed='',nd='';
  for(const p of sc.platforms){
    const pts=[P(p.x,p.y,0),P(p.x+p.w,p.y,0),P(p.x+p.w,p.y+p.d,0),P(p.x,p.y+p.d,0)];
    pl+=`<polygon points="${pts.map(pt).join(' ')}" fill="#efe4d6" stroke="#cdbba5" stroke-width="1.2" stroke-dasharray="6 4"/>`;
    const [lx,ly]=P(p.x+0.3,p.y+p.d-0.2,0);
    const ang=Math.atan2(CY,-CX)*180/Math.PI+180; // along -y direction? use x-axis direction
    const [ax,ay]=P(p.x+0.4,p.y+p.d-0.25,0);
    pl+=`<text class="plat-lbl" transform="translate(${ax},${ay}) rotate(${Math.atan2(CY,CX)*180/Math.PI})" dy="-4">${p.label}</text>`;
  }
  for(const e of sc.edges){
    const d='M'+e.pts.map(q=>pt(P(q[0],q[1],q[2]??0.02))).join(' L');
    ed+=`<path class="edge" id="E-${e.id}" d="${d}"/>`;
  }
  const order=[...sc.nodes].sort((a,b)=>(a.x+a.w+a.y+a.d+(a.z||0)*0.01)-(b.x+b.w+b.y+b.d+(b.z||0)*0.01));
  let tx='';for(const n of order){nd+=`<g class="node" id="N-${n.id}">${shape(n)}</g>`;tx+=`<g class="tl" id="T-${n.id}">${textAt(n)}</g>`;}
  svg.innerHTML=`<g id="root">${pl}${ed}${nd}${tx}<g id="fx"></g></g>`;
  const bb=svg.getElementById('root').getBBox();
  const pad=22;
  svg.setAttribute('viewBox',`${bb.x-pad} ${bb.y-pad-10} ${bb.width+pad*2} ${bb.height+pad*2+10}`);
}

function edgeById(id){return scene.edges.find(e=>e.id===id);}
function showStep(i){
  step=i; const st=scene.steps[i];
  document.getElementById('stepno').textContent=`BƯỚC ${i+1} / ${scene.steps.length}`;
  document.getElementById('stitle').textContent=st.t;
  document.getElementById('sbody').innerHTML=st.b;
  document.querySelector('#ssay span').textContent=st.say;
  document.getElementById('sfile').innerHTML=st.f?`📁 <span class="mono">${st.f}</span>`:'';
  document.getElementById('prev').disabled=i===0;
  document.getElementById('next').textContent=i===scene.steps.length-1?'Từ đầu ↺':'Tiếp →';
  document.querySelectorAll('.dot').forEach((d,k)=>d.classList.toggle('on',k===i));
  const hl=st.hl==='*'?null:new Set(st.hl);
  scene.nodes.forEach(n=>{const dm=!!hl&&!hl.has(n.id);svg.getElementById('N-'+n.id).classList.toggle('dim',dm);svg.getElementById('T-'+n.id).classList.toggle('dim',dm);});
  const flows=st.flow.map(f=>typeof f==='string'?{e:f}:f);
  const on=new Set(flows.map(f=>f.e));
  scene.edges.forEach(e=>{const el=svg.getElementById('E-'+e.id);
    el.classList.toggle('on',on.has(e.id)); el.classList.toggle('dim',!!hl&&!on.has(e.id));});
  runFlow(flows);
}

function runFlow(flows){
  if(anim)cancelAnimationFrame(anim);
  const fx=svg.getElementById('fx'); fx.innerHTML='';
  if(!flows.length)return;
  const segs=flows.map(f=>{const e=edgeById(f.e);let pts=e.pts.map(q=>P(q[0],q[1],(q[2]??0)+0.35));if(f.rev)pts=[...pts].reverse();
    let L=0;const cum=[0];for(let k=1;k<pts.length;k++){L+=Math.hypot(pts[k][0]-pts[k-1][0],pts[k][1]-pts[k-1][1]);cum.push(L);}
    return {pts,cum,L,label:f.label||e.label};});
  fx.innerHTML=`<g id="pk"><polygon points="0,-7 8,-2.5 0,2 -8,-2.5" fill="#f3a27c" stroke="#2b2622" stroke-width="1"/><polygon points="-8,-2.5 0,2 0,8 -8,3.5" fill="#d9643a" stroke="#2b2622" stroke-width="1"/><polygon points="8,-2.5 0,2 0,8 8,3.5" fill="#b44f2a" stroke="#2b2622" stroke-width="1"/></g><g class="elbl" id="el"><rect rx="6" ry="6"/><text text-anchor="middle" dy="4"></text></g>`;
  const pk=svg.getElementById('pk'), el=svg.getElementById('el'), et=el.querySelector('text'), er=el.querySelector('rect');
  const SEG_MS=2000, HOLD_MS=700; let si=0, t0=null, hold=0;
  function setLabel(s){et.textContent=s.label;const w=et.getComputedTextLength()+16;er.setAttribute('x',-w/2);er.setAttribute('y',-10);er.setAttribute('width',w);er.setAttribute('height',20);
    const m=at(s,s.L/2);el.setAttribute('transform',`translate(${m[0]},${m[1]-22})`);}
  function at(s,dist){let k=1;while(k<s.cum.length-1&&s.cum[k]<dist)k++;const a=s.pts[k-1],b=s.pts[k],seg=(s.cum[k]-s.cum[k-1])||1,u=Math.min(1,Math.max(0,(dist-s.cum[k-1])/seg));
    return [a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];}
  setLabel(segs[0]);
  function tick(ts){
    if(t0===null)t0=ts; const s=segs[si]; const dist=Math.min(1,(ts-t0)/SEG_MS)*s.L;
    if(dist>=s.L){ if(!hold)hold=ts; const p=at(s,s.L);pk.setAttribute('transform',`translate(${p[0]},${p[1]})`);
      if(ts-hold>HOLD_MS){si=(si+1)%segs.length;t0=null;hold=0;if(si===0){/* loop pause */} setLabel(segs[si]);} }
    else{const p=at(s,dist);pk.setAttribute('transform',`translate(${p[0]},${p[1]})`);}
    anim=requestAnimationFrame(tick);
  }
  anim=requestAnimationFrame(tick);
}

function loadScene(key){
  sceneKey=key; scene=SCENES[key];
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.k===key));
  render();
  const dots=document.getElementById('dots');dots.innerHTML='';
  scene.steps.forEach((_,k)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label','Bước '+(k+1));b.onclick=()=>showStep(k);dots.appendChild(b);});
  document.getElementById('qa').innerHTML=scene.qa.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('');
  showStep(0);
  if(location.hash!=='#'+key)history.replaceState(null,'','#'+key);
}

const tabs=document.getElementById('tabs');
Object.entries(SCENES).forEach(([k,s],i)=>{const b=document.createElement('button');b.className='tab';b.role='tab';b.dataset.k=k;
  b.innerHTML=`<span class="n">${i}</span>${s.name}`;b.onclick=()=>loadScene(k);tabs.appendChild(b);});
document.getElementById('next').onclick=()=>showStep(step===scene.steps.length-1?0:step+1);
document.getElementById('prev').onclick=()=>step>0&&showStep(step-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click();});
window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(SCENES[k]&&k!==sceneKey)loadScene(k);});
const start=location.hash.slice(1);
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>loadScene(SCENES[start]?start:'overview'));
</script>
