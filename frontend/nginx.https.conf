# HTTPS variant used on the EC2 server only (mounted by compose.server.yaml).
# Local development keeps using nginx.conf (HTTP only). Keep the locations below
# in sync with nginx.conf when routes change.
# Single public entry point:
#   /admin/*  → Web Quản lý (Admin, BranchManager)
#   /pos/*    → POS Nhân viên (Staff)
#   /*        → Web Khách (Customer)
#   /api/*    → API container (internal network only)
# HTTP → HTTPS
server {
    listen 80;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name 15-134-162-105.sslip.io;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/15-134-162-105.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/15-134-162-105.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vite emits content-hashed file names, so they can be cached forever.
    location ~ ^/(admin/|pos/)?assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # SPA routing per app; index.html is never cached so new deploys are picked up.
    location = /admin { return 301 /admin/; }
    location /admin/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /admin/index.html;
    }

    location = /pos { return 301 /pos/; }
    location /pos/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /pos/index.html;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
