name: cafe-cr

services:
  api:
    build:
      context: .
      dockerfile: backend/src/ChonRieng.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:-}
      Jwt__SigningKey: ${Jwt__SigningKey:-}
      Jwt__Issuer: ${Jwt__Issuer:-CafeCR}
      Jwt__Audience: ${Jwt__Audience:-CafeCR.Api}
      BootstrapAdmin__Email: ${BootstrapAdmin__Email:-}
      BootstrapAdmin__Password: ${BootstrapAdmin__Password:-}
      BootstrapAdmin__FullName: ${BootstrapAdmin__FullName:-Administrator}
      DevelopmentSeed__Password: ${DevelopmentSeed__Password:-}
      DevelopmentSeed__HistoryFrom: ${DevelopmentSeed__HistoryFrom:-}
      Payment__Bank: ${Payment__Bank:-SePay}
      Payment__AccountNumber: ${Payment__AccountNumber:-0000000000}
      Payment__AccountHolder: ${Payment__AccountHolder:-Cafe CR}
      Payment__CodePrefix: ${Payment__CodePrefix:-TT}
      Payment__QrImageBaseUrl: ${Payment__QrImageBaseUrl:-https://qr.sepay.vn/img}
      Payment__HoldMinutes: ${Payment__HoldMinutes:-10}
      Payment__WebhookSecret: ${Payment__WebhookSecret:?Set Payment__WebhookSecret in .env to the SePay HMAC secret}
      Payment__TimestampToleranceSeconds: ${Payment__TimestampToleranceSeconds:-300}
      Payment__ValidateOnStart: ${Payment__ValidateOnStart:-true}
    # Bound to localhost only: the public entry point is the web (nginx) service.
    # Swagger stays reachable from this machine (or an SSH tunnel on EC2).
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

  # nginx: customer web at /, Web Quản lý at /admin, POS at /pos, API proxied at /api.
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"
