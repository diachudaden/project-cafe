name: cafe-cr

services:
  api:
    build:
      context: .
      dockerfile: backend/src/ChonRieng.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:-}
      Jwt__SigningKey: ${Jwt__SigningKey:-}
      Jwt__Issuer: ${Jwt__Issuer:-CafeCR}
      Jwt__Audience: ${Jwt__Audience:-CafeCR.Api}
      BootstrapAdmin__Email: ${BootstrapAdmin__Email:-}
      BootstrapAdmin__Password: ${BootstrapAdmin__Password:-}
      BootstrapAdmin__FullName: ${BootstrapAdmin__FullName:-Administrator}
      DevelopmentSeed__Password: ${DevelopmentSeed__Password:-}
      DevelopmentSeed__HistoryFrom: ${DevelopmentSeed__HistoryFrom:-}
      Payment__Bank: ${Payment__Bank:-SePay}
      Payment__AccountNumber: ${Payment__AccountNumber:-0000000000}
      Payment__AccountHolder: ${Payment__AccountHolder:-Cafe CR}
      Payment__CodePrefix: ${Payment__CodePrefix:-TT}
      Payment__QrImageBaseUrl: ${Payment__QrImageBaseUrl:-https://qr.sepay.vn/img}
      Payment__HoldMinutes: ${Payment__HoldMinutes:-10}
      Payment__WebhookSecret: ${Payment__WebhookSecret:?Set Payment__WebhookSecret in .env to the SePay HMAC secret}
      Payment__TimestampToleranceSeconds: ${Payment__TimestampToleranceSeconds:-300}
      Payment__ValidateOnStart: ${Payment__ValidateOnStart:-true}
      # Auto-release overdue seats (TASK-024): minutes past EndAt before the system frees the seat; 0 = off.
      Sessions__AutoReleaseGraceMinutes: ${Sessions__AutoReleaseGraceMinutes:-10}
      Sessions__AutoReleaseIntervalSeconds: ${Sessions__AutoReleaseIntervalSeconds:-60}
      # Inventory (TASK-027): count tolerance = max(min units, round(usage × percent)); jobs = reminders, restock, nightly reconcile/norms.
      Inventory__ToleranceMinUnits: ${Inventory__ToleranceMinUnits:-2}
      Inventory__TolerancePercent: ${Inventory__TolerancePercent:-0.08}
      Inventory__RotationDays: ${Inventory__RotationDays:-3}
      Inventory__JobsEnabled: ${Inventory__JobsEnabled:-true}
      # Email (TASK-028): dev defaults send to Mailpit (web UI http://localhost:8025). Production: Gmail SMTP on 587
      # with STARTTLS and an App Password; set Email__Username/Email__Password only in .env.
      Email__Host: ${Email__Host:-mailpit}
      Email__Port: ${Email__Port:-1025}
      Email__Username: ${Email__Username:-}
      Email__Password: ${Email__Password:-}
      Email__FromAddress: ${Email__FromAddress:-no-reply@chonrieng.local}
      Email__FromName: ${Email__FromName:-Chọn Riêng Cafe}
      Email__UseStartTls: ${Email__UseStartTls:-false}
      # Public origin of the web apps (no trailing /); reset links are built from it, never from the request.
      App__PublicBaseUrl: ${App__PublicBaseUrl:-http://localhost}
      PasswordReset__TokenMinutes: ${PasswordReset__TokenMinutes:-15}
      # Data Protection keys sign reset tokens; kept on a volume so links survive a restart.
      DataProtection__KeysPath: /keys
    volumes:
      - dataprotection_keys:/keys
    depends_on:
      - mailpit
    # Bound to localhost only: the public entry point is the web (nginx) service.
    # Swagger stays reachable from this machine (or an SSH tunnel on EC2).
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

  # nginx: customer web at /, Web Quản lý at /admin, POS at /pos, API proxied at /api.
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

  # Dev SMTP catcher (TASK-028): the API sends to mailpit:1025 inside the network (not published);
  # read the mails at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  dataprotection_keys:
