name: cafe-cr

services:
  api:
    build:
      context: .
      dockerfile: backend/src/ChonRieng.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:-}
      Jwt__SigningKey: ${Jwt__SigningKey:-}
      Jwt__Issuer: ${Jwt__Issuer:-CafeCR}
      Jwt__Audience: ${Jwt__Audience:-CafeCR.Api}
      BootstrapAdmin__Email: ${BootstrapAdmin__Email:-}
      BootstrapAdmin__Password: ${BootstrapAdmin__Password:-}
      BootstrapAdmin__FullName: ${BootstrapAdmin__FullName:-Administrator}
      DevelopmentSeed__Password: ${DevelopmentSeed__Password:-}
    ports:
      - "${API_PORT:-8080}:8080"
