# Server-only additions (EC2): HTTPS on 443 with the host's Let's Encrypt certificates.
# Enabled on the server by this line in .env:
#   COMPOSE_FILE=compose.yaml:compose.server.yaml
services:
  web:
    ports:
      - "443:443"
    volumes:
      - ./frontend/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
